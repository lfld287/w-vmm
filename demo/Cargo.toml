[package]
name = "w-vmm-demo"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[[bin]]
name = "w-vmm"
path = "src/main.rs"

[dependencies]
thiserror = "2"
clap = { version = "4", features = ["derive"] }
w-vmm = { path = ".." }
libc = "0.2"
signal-hook = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
